[package]
name = "tomni-ui-win32"
description = "As chamadas Win32 que nenhum crate expõe com API segura (Pageant, pid de quem pede a chave): o único crate com unsafe do projeto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Só existe no Windows: nos outros sistemas o crate é vazio e não puxa nada.
[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "io-util", "macros"] }

[lints]
workspace = true
