# O MinIO de verdade para o teste opcional do M32 (`crates/files/tests/s3_real.rs`).
# O bucket `teste` nasce da pasta em /data (o MinIO de disco único trata cada pasta como um bucket).
services:
  minio:
    image: minio/minio
    entrypoint: ["sh", "-c", "mkdir -p /data/teste && exec minio server /data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19000:9000"
