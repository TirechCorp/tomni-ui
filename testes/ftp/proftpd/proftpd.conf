# proftpd 1.3.8 (Debian bookworm): FTP na 2122 com TLS explícito (e a retomada de sessão exigida,
# o padrão do mod_tls), e FTPS implícito na 2991.
ModulePath /usr/lib/proftpd
LoadModule mod_tls.c

ServerName "teste"
ServerType standalone
DefaultServer on
Port 2122
UseIPv6 off
User proftpd
Group nogroup
AuthOrder mod_auth_unix.c
WtmpLog off
UseReverseDNS off
PassivePorts 30100 30149
MasqueradeAddress 127.0.0.1
TransferLog none
SystemLog /var/log/proftpd/proftpd.log

# Vale também para o <VirtualHost> (o DefaultRoot não é herdado dele). AllowOverwrite e
# AllowStoreRestart: sem eles o proftpd recusa regravar e retomar um envio (REST + STOR, APPE).
<Global>
  DefaultRoot ~
  RequireValidShell off
  Umask 022
  AllowOverwrite on
  AllowStoreRestart on
</Global>

<IfModule mod_tls.c>
  TLSEngine on
  TLSLog /var/log/proftpd/tls.log
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/certs/ftp.crt
  TLSRSACertificateKeyFile /etc/ssl/private/ftp.key
  TLSRequired off
</IfModule>

<VirtualHost 127.0.0.1>
  ServerName "teste implicito"
  Port 2991
  MasqueradeAddress 127.0.0.1
  PassivePorts 30150 30199
  <IfModule mod_tls.c>
    TLSEngine on
    TLSOptions UseImplicitSSL
    TLSProtocol TLSv1.2 TLSv1.3
    TLSRSACertificateFile /etc/ssl/certs/ftp.crt
    TLSRSACertificateKeyFile /etc/ssl/private/ftp.key
    TLSRequired on
  </IfModule>
</VirtualHost>
