# vsftpd 3.0.3 (Debian bookworm): FTP na 2121, com TLS explícito e a retomada de sessão exigida.
listen=YES
listen_ipv6=NO
listen_address=127.0.0.1
listen_port=2121
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=NO
xferlog_enable=NO
connect_from_port_20=NO
secure_chroot_dir=/var/run/vsftpd/empty
seccomp_sandbox=NO
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/srv/ftp
pam_service_name=vsftpd
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30049
pasv_address=127.0.0.1
ssl_enable=YES
rsa_cert_file=/etc/ssl/private/ftp.pem
rsa_private_key_file=/etc/ssl/private/ftp.pem
require_ssl_reuse=YES
force_local_logins_ssl=NO
force_local_data_ssl=NO
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
