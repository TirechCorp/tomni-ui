# Um nó oficial do teste real do M48 (certificado direto-chacha): o sshd e o eco ficam no contêiner ao lado,
# que usa a rede deste. Chaves só de teste.
pki:
  ca: /fixtures/ca-25519.crt
  cert: /fixtures/direto-chacha.crt
  key: /fixtures/direto-chacha.key

static_host_map:
  "10.42.0.3": ["lighthouse-chacha:4242"]

lighthouse:
  am_lighthouse: false
  interval: 5
  hosts:
    - "10.42.0.3"

listen:
  host: 0.0.0.0
  port: 4242

punchy:
  punch: true
  respond: true

tun:
  dev: nebula1
  mtu: 1300

cipher: chachapoly

logging:
  level: info

firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    - port: any
      proto: any
      host: any
